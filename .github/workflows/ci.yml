name: CI

on: [push]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: taskmanager-backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: taskmanager-backend
        run: pytest

      - name: Build Docker image

        run: docker build -t taskmanager-backend ./taskmanager-backend